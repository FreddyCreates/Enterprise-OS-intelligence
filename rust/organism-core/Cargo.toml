[package]
name        = "organism-core"
version     = "1.0.0"
edition     = "2021"
description = "Sovereign organism core — phi-math, AES-256-GCM encryption, Ed25519 signing, organism wire protocol"
license     = "MIT"

[dependencies]
# AES-256-GCM authenticated encryption
aes-gcm        = "0.10"
# Ed25519 signatures (pinned to the pre-PKCS8 dependency line for current Cargo compatibility)
ed25519-dalek  = "=1.0.1"
# BLAKE3 fast hashing (pinned below the edition-2024 transition for current Cargo compatibility)
blake3         = "=1.7.0"
# Cryptographically-secure random bytes
rand           = "=0.7.3"
# Base64 encoding for key/ciphertext serialisation
base64         = "0.22"
# SHA-2 for HKDF-based key derivation
sha2           = "0.10"
# HKDF key derivation
hkdf           = "0.12"
# Serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# Hex encoding
hex            = "0.4"

[[bin]]
name = "organism-demo"
path = "src/main.rs"
