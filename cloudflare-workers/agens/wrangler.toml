name            = "agens"
main            = "worker.js"
compatibility_date = "2024-09-02"

[vars]
DESIGNATION     = "RSHIP-AIS-AG-001"
WORKER_NAME     = "AGENS"
WORKER_LATIN    = "agens"
WORKER_MEANING  = "The One Who Acts — Agent AI Services"
VERSION         = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — "Brains and Hearts"
# ═══════════════════════════════════════════════════════════════════════════════

# Workers AI — LLM reasoning, image generation, embeddings
[ai]
binding = "AI"

# KV Namespaces — Fast key-value storage for sessions, cache, blocklists
[[kv_namespaces]]
binding = "SESSION_STORE"
id = "PLACEHOLDER_SESSION_STORE_ID"
# Create with: wrangler kv namespace create SESSION_STORE

[[kv_namespaces]]
binding = "KNOWLEDGE_CACHE"
id = "PLACEHOLDER_KNOWLEDGE_CACHE_ID"
# Create with: wrangler kv namespace create KNOWLEDGE_CACHE

[[kv_namespaces]]
binding = "IP_BLOCKLIST"
id = "PLACEHOLDER_IP_BLOCKLIST_ID"
# Create with: wrangler kv namespace create IP_BLOCKLIST

# D1 Database — Structured intelligence storage
[[d1_databases]]
binding = "INTELLIGENCE_DB"
database_name = "medinatech-intelligence"
database_id = "PLACEHOLDER_D1_DATABASE_ID"
# Create with: wrangler d1 create medinatech-intelligence

# Queues — Async message passing between Workers
[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "intelligence-events"

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "ai-analysis"

# R2 Bucket — Object storage for files, archives, large data
[[r2_buckets]]
binding = "ASSET_STORE"
bucket_name = "medinatech-assets"
# Create with: wrangler r2 bucket create medinatech-assets

# Vectorize — Vector search for semantic/RAG capabilities
[[vectorize]]
binding = "KNOWLEDGE_VECTORS"
index_name = "medinatech-knowledge-index"
# Create with: wrangler vectorize create medinatech-knowledge-index --dimensions=768 --metric=cosine

# Analytics Engine — Metrics and telemetry
[[analytics_engine_datasets]]
binding = "AGENS_ANALYTICS"
dataset = "agens_telemetry"

# Service Bindings — Direct Worker-to-Worker calls
[[services]]
binding = "CEREBRUM"
service = "cerebrum"

[[services]]
binding = "NEXUS"
service = "nexus"

[[services]]
binding = "VIGIL"
service = "vigil"
