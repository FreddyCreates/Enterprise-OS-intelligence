name            = "cache-organism"
main            = "worker.js"
compatibility_date = "2024-09-02"

[vars]
DESIGNATION     = "RSHIP-AIS-CO-001"
WORKER_NAME     = "CACHE-ORGANISM"
WORKER_LATIN    = "cachea-organismus"
WORKER_MEANING  = "Living Cache — Intelligent Cache Layer"
VERSION         = "1.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT CACHE ORGANISM BINDINGS
# The cache layer IS the intelligent agent — not just storage
# ═══════════════════════════════════════════════════════════════════════════════

# KV Namespace — The organism's persistent memory
# This is where the "intelligence" lives between requests
[[kv_namespaces]]
binding = "ORGANISM_MEMORY"
id = "PLACEHOLDER_ORGANISM_MEMORY_ID"
# Create with: wrangler kv namespace create ORGANISM_MEMORY

# KV Namespace — Learned patterns (traffic analysis)
[[kv_namespaces]]
binding = "PATTERN_STORE"
id = "PLACEHOLDER_PATTERN_STORE_ID"
# Create with: wrangler kv namespace create PATTERN_STORE

# KV Namespace — Visitor profiles (behavioral learning)
[[kv_namespaces]]
binding = "VISITOR_PROFILES"
id = "PLACEHOLDER_VISITOR_PROFILES_ID"
# Create with: wrangler kv namespace create VISITOR_PROFILES

# KV Namespace — Cached intelligent responses
[[kv_namespaces]]
binding = "RESPONSE_CACHE"
id = "PLACEHOLDER_RESPONSE_CACHE_ID"
# Create with: wrangler kv namespace create RESPONSE_CACHE

# D1 Database — Structured organism memory (for complex queries)
[[d1_databases]]
binding = "ORGANISM_DB"
database_name = "organism-intelligence"
database_id = "PLACEHOLDER_ORGANISM_DB_ID"
# Create with: wrangler d1 create organism-intelligence

# Queue — Async learning tasks (decouple learning from response)
[[queues.producers]]
binding = "LEARNING_QUEUE"
queue = "organism-learning"

[[queues.consumers]]
queue = "organism-learning"
max_batch_size = 25
max_retries = 3

# Analytics Engine — Organism telemetry
[[analytics_engine_datasets]]
binding = "ORGANISM_ANALYTICS"
dataset = "organism_telemetry"

# Cron trigger — Organism heartbeat (keeps state alive)
[triggers]
crons = ["*/5 * * * *"]  # Every 5 minutes

# ═══════════════════════════════════════════════════════════════════════════════
# ARCHITECTURE NOTES
# ═══════════════════════════════════════════════════════════════════════════════
#
# TWO-LAYER COMPUTE MODEL:
#
# 1. BILLING COMPUTE (Cloudflare CPU)
#    - This Worker handles TLS termination
#    - Cheap pattern matching for classification
#    - Routing decisions to cache-organism
#    - Minimal CPU time billed
#
# 2. ORGANISM COMPUTE (Cache Layer)
#    - Intelligence lives in KV entries
#    - Learned patterns stored as cached data
#    - "Dynamic" responses generated from cache
#    - NOT 1:1 mapped to Cloudflare CPU
#    - Cloudflare sees "cache hit", organism sees cognition
#
# KEY INVERSION:
#   Before: cache = dumb storage, Workers = compute
#   After:  cache = semi-autonomous agent
#
# ═══════════════════════════════════════════════════════════════════════════════
