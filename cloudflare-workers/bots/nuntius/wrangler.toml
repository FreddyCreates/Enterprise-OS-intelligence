name            = "rship-nuntius"
main            = "worker.js"
compatibility_date = "2024-09-02"

# Cron: morning briefing + evening summary
[[triggers.crons]]
cron = "0 9 * * 1-5"    # 09:00 UTC Mon-Fri — Morning enterprise briefing
[[triggers.crons]]
cron = "0 17 * * 1-5"   # 17:00 UTC Mon-Fri — End-of-day summary

# Required secrets:
#   SLACK_SIGNING_SECRET      — from api.slack.com/apps
#   SLACK_BOT_TOKEN           — Bot User OAuth Token (xoxb-...)
#
# Channel IDs (right-click channel in Slack → Copy link → ID is last segment):
#   NUNTIUS_OPS_CHANNEL       — #rship-ops channel ID (C...)
#   NUNTIUS_MARKET_CHANNEL    — #rship-market channel ID
#   NUNTIUS_ALERTS_CHANNEL    — #rship-alerts channel ID
#   NUNTIUS_INTEL_CHANNEL     — #rship-intel channel ID (general)

[vars]
DESIGNATION     = "RSHIP-BOT-NNT-001"
BOT_NAME        = "NUNTIUS"
BOT_LATIN       = "nuntius"
BOT_MEANING     = "Messenger · Announcer · Voice of the Organism"
VERSION         = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — "Brains and Hearts"
# NUNTIUS is the Voice — optimized for scheduled announcements and briefings
# ═══════════════════════════════════════════════════════════════════════════════

# Workers AI — LLM reasoning for briefing generation
[ai]
binding = "AI"

# KV Namespaces — Fast key-value storage for briefing state
[[kv_namespaces]]
binding = "BRIEFING_CACHE"
id = "PLACEHOLDER_BRIEFING_CACHE_ID"
# Create with: wrangler kv namespace create BRIEFING_CACHE

[[kv_namespaces]]
binding = "INTEL_DIGEST"
id = "PLACEHOLDER_INTEL_DIGEST_ID"
# Create with: wrangler kv namespace create INTEL_DIGEST

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "PLACEHOLDER_SESSION_STORE_ID"

# D1 Database — Structured briefing history
[[d1_databases]]
binding = "BRIEFING_DB"
database_name = "medinatech-intelligence"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# Queues — Async briefing distribution
[[queues.producers]]
binding = "BRIEFING_QUEUE"
queue = "briefings"
# Create with: wrangler queues create briefings

# Vectorize — Vector search for intelligence synthesis
[[vectorize]]
binding = "INTEL_VECTORS"
index_name = "intel-synthesis-index"
# Create with: wrangler vectorize create intel-synthesis-index --dimensions=768 --metric=cosine

# Analytics Engine — Briefing metrics
[[analytics_engine_datasets]]
binding = "NUNTIUS_ANALYTICS"
dataset = "nuntius_briefing_telemetry"

# Service Bindings
[[services]]
binding = "CEREBRUM"
service = "cerebrum"

[[services]]
binding = "PULSE"
service = "rship-pulse"
