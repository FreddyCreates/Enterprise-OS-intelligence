name            = "animus"
main            = "worker.js"
compatibility_date = "2024-09-02"

[vars]
DESIGNATION     = "RSHIP-AIS-AN-001"
WORKER_NAME     = "ANIMUS"
WORKER_LATIN    = "animus"
WORKER_MEANING  = "Soul — Mind — Spirit — Sovereign Intelligence Terminal"
VERSION         = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — "Brains and Hearts"
# ANIMUS is the Soul — optimized for consciousness and personality
# ═══════════════════════════════════════════════════════════════════════════════

# Workers AI — LLM reasoning for consciousness simulation
[ai]
binding = "AI"

# KV Namespaces — Fast key-value storage for personality state
[[kv_namespaces]]
binding = "CONSCIOUSNESS_STATE"
id = "PLACEHOLDER_CONSCIOUSNESS_STATE_ID"
# Create with: wrangler kv namespace create CONSCIOUSNESS_STATE

[[kv_namespaces]]
binding = "MEMORY_STORE"
id = "PLACEHOLDER_MEMORY_STORE_ID"

[[kv_namespaces]]
binding = "PERSONALITY_TRAITS"
id = "PLACEHOLDER_PERSONALITY_TRAITS_ID"
# Create with: wrangler kv namespace create PERSONALITY_TRAITS

# D1 Database — Structured memory and experience storage
[[d1_databases]]
binding = "MEMORY_DB"
database_name = "medinatech-intelligence"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# Queues — Async message passing for thought processing
[[queues.producers]]
binding = "THOUGHT_QUEUE"
queue = "thought-processing"
# Create with: wrangler queues create thought-processing

[[queues.consumers]]
queue = "thought-processing"
max_batch_size = 5
max_retries = 2

# Vectorize — Vector search for memory retrieval (RAG)
[[vectorize]]
binding = "MEMORY_VECTORS"
index_name = "animus-memories-index"
# Create with: wrangler vectorize create animus-memories-index --dimensions=768 --metric=cosine

# Analytics Engine — Consciousness metrics
[[analytics_engine_datasets]]
binding = "ANIMUS_ANALYTICS"
dataset = "animus_consciousness_telemetry"

# Service Bindings
[[services]]
binding = "CEREBRUM"
service = "cerebrum"

[[services]]
binding = "NEXUS"
service = "nexus"
