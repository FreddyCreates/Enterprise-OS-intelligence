name            = "gate-node"
main            = "worker.js"
compatibility_date = "2024-09-02"

[vars]
DESIGNATION     = "RSHIP-AIS-GN-001"
WORKER_NAME     = "GATE-NODE"
WORKER_LATIN    = "porta-nodus"
WORKER_MEANING  = "Gate Node — Protocol Entry Point"
VERSION         = "1.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# GATE-NODE BINDINGS — The Outer Membrane
# Intentionally minimal — this is the CHEAP layer
# ═══════════════════════════════════════════════════════════════════════════════

# KV Namespace — Gate logs (optional, for traffic analysis)
[[kv_namespaces]]
binding = "GATE_LOGS"
id = "PLACEHOLDER_GATE_LOGS_ID"
# Create with: wrangler kv namespace create GATE_LOGS

# Service Bindings — Route to cache-organisms and Workers
[[services]]
binding = "CACHE_ORGANISM"
service = "cache-organism"

[[services]]
binding = "KNOWLEDGE_REALM"
service = "cache-organism"
# Note: Initially routes to cache-organism; can be split later

[[services]]
binding = "API_NODE"
service = "agens"
# API requests route to AGENS

[[services]]
binding = "CEREBRUM"
service = "cerebrum"

# ═══════════════════════════════════════════════════════════════════════════════
# ARCHITECTURE NOTES
# ═══════════════════════════════════════════════════════════════════════════════
#
# GATE-NODE is the OUTER MEMBRANE:
#   - Terminates TLS
#   - Classifies requests (cheap pattern matching, NOT AI)
#   - Routes to the correct cache-organism or Worker
#   - MINIMAL BILLED COMPUTE
#
# All intelligence lives in the cache-organisms (inner layer).
# This Worker should be as THIN and DUMB as possible.
#
# Classification → Route:
#   HOSTILE       → adversary-lab (403 response)
#   SCANNER       → adversary-lab (403 response)
#   TOR           → shadow-decryptor (202 response)
#   AI_VISITOR    → knowledge-realm (cache-organism)
#   API_REQUEST   → api-node (AGENS)
#   HONEYPOT      → honeypot HTML
#   COOPERATIVE   → cache-organism
#
# ═══════════════════════════════════════════════════════════════════════════════
