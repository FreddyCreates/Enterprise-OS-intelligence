name               = "cursor"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: cursor.<account-subdomain>.workers.dev
# Public domain will be set when assigned — add a [[routes]] block.

[vars]
DESIGNATION    = "RSHIP-AIS-CS-001"
WORKER_NAME    = "CURSOR"
WORKER_LATIN   = "cursor"
WORKER_MEANING = "Runner — Messenger"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — CURSOR delivers messages between workers
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Smart routing ────────────────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Message queue state ────────────────────────────────────────
[[kv_namespaces]]
binding = "MESSAGE_STATE"
id = "cursor-message-state"
preview_id = "cursor-message-state-preview"

[[kv_namespaces]]
binding = "ROUTING_TABLE"
id = "cursor-routing-table"
preview_id = "cursor-routing-table-preview"

# ── D1 Database — Core data ───────────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── Queue — Message routing ───────────────────────────────────────────────────
[[queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "ai-analysis"

[[queues.consumers]]
queue = "ai-analysis"
max_batch_size = 10
max_batch_timeout = 30

# ── R2 Bucket — Message attachments + route artifacts ─────────────────────────
[[r2_buckets]]
binding = "MESSAGE_ARCHIVE"
bucket_name = "cursor-message-archive"

# ── Vectorize — Semantic message routing ──────────────────────────────────────
[[vectorize]]
binding = "ROUTING_VECTORS"
index_name = "cursor-routing-patterns"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "CURSOR_ANALYTICS"
dataset = "cursor_events"

# ── Service Bindings — Cursor talks to everyone ───────────────────────────────
[[services]]
binding = "CEREBRUM"
service = "cerebrum"

[[services]]
binding = "AGENS"
service = "agens"

[[services]]
binding = "ANIMUS"
service = "animus"

[[services]]
binding = "NEXUS"
service = "nexus"

[[services]]
binding = "VIGIL"
service = "vigil"

[[services]]
binding = "NOVA"
service = "nova"

[[services]]
binding = "EMAILAI_MESH"
service = "emailai-mesh"

[[services]]
binding = "GATE_NODE"
service = "gate-node"

[[services]]
binding = "CACHE_ORGANISM"
service = "cache-organism"
