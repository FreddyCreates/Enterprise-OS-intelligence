# ═══════════════════════════════════════════════════════════════════════════════
# wrangler.toml — RSHIP Enterprise OS Root Worker Configuration
# Medina Tech · RSHIP-2026 · Dallas, TX
#
# This config is for the root orchestrator worker that provides:
#   - Health/status across all services
#   - Binding validation
#   - Cross-worker dispatch
#
# Individual workers have their own wrangler.toml in cloudflare-workers/*/
# Pages config lives in wrangler.jsonc (uses setup-pages-bindings.sh for IDs)
# ═══════════════════════════════════════════════════════════════════════════════

name = "rship-enterprise-os"
main = "tools/orchestrator.js"
compatibility_date = "2024-09-02"
workers_dev = true

# ── Environment Variables ─────────────────────────────────────────────────────
[vars]
ORGANISM        = "RSHIP"
VERSION         = "5.1.0"
PLATFORM        = "cloudflare"
DESIGNATION     = "RSHIP-ORCHESTRATOR-001"
ORGANISM_TYPE   = "ROOT_INTELLIGENCE"

# ── Development ───────────────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ── Workers AI ────────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespaces — Orchestration State ───────────────────────────────────────
[[kv_namespaces]]
binding = "ORCHESTRATOR_STATE"
id = "orchestrator-state"
preview_id = "orchestrator-state-preview"

[[kv_namespaces]]
binding = "HEALTH_CACHE"
id = "orchestrator-health-cache"
preview_id = "orchestrator-health-cache-preview"

# ── D1 Database — Core Intelligence ──────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── R2 Bucket — Shared Assets ────────────────────────────────────────────────
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "medinatech-assets"

# ── Queues — Cross-worker dispatch ───────────────────────────────────────────
[[queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "ai-analysis"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "ORCHESTRATOR_ANALYTICS"
dataset = "orchestrator_events"

# ── Service Bindings — Route to all workers ───────────────────────────────────
[[services]]
binding = "CEREBRUM"
service = "cerebrum"

[[services]]
binding = "AGENS"
service = "agens"

[[services]]
binding = "ANIMUS"
service = "animus"

[[services]]
binding = "NEXUS"
service = "nexus"

[[services]]
binding = "VIGIL"
service = "vigil"

[[services]]
binding = "CURSOR"
service = "cursor"

[[services]]
binding = "NOVA"
service = "nova"

[[services]]
binding = "EMAILAI_MESH"
service = "emailai-mesh"

[[services]]
binding = "GATE_NODE"
service = "gate-node"

[[services]]
binding = "CACHE_ORGANISM"
service = "cache-organism"

# ── Production Environment ────────────────────────────────────────────────────
[env.production]
name = "rship-enterprise-os-prod"
route = { pattern = "api.rship.medina.tech/*", zone_name = "medina.tech" }

[env.production.vars]
ENVIRONMENT = "production"

# ── Staging Environment ───────────────────────────────────────────────────────
[env.staging]
name = "rship-enterprise-os-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
