<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A227;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#F4D03F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C9A227;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#dark)"/>

  <!-- Organism symbol - interconnected nodes -->
  <g transform="translate(60, 100)" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="12" fill="url(#gold)"/>
    <!-- Orbiting nodes -->
    <circle cx="35" cy="-20" r="7" fill="url(#gold)" opacity="0.9"/>
    <circle cx="-35" cy="-20" r="7" fill="url(#gold)" opacity="0.9"/>
    <circle cx="35" cy="20" r="7" fill="url(#gold)" opacity="0.9"/>
    <circle cx="-35" cy="20" r="7" fill="url(#gold)" opacity="0.9"/>
    <circle cx="0" cy="-40" r="5" fill="url(#gold)" opacity="0.7"/>
    <circle cx="0" cy="40" r="5" fill="url(#gold)" opacity="0.7"/>
    <!-- Connections -->
    <line x1="0" y1="0" x2="35" y2="-20" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-35" y2="-20" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="35" y2="20" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-35" y2="20" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="-20" x2="0" y2="-40" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
    <line x1="-35" y1="-20" x2="0" y2="-40" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
    <line x1="35" y1="20" x2="0" y2="40" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
    <line x1="-35" y1="20" x2="0" y2="40" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="50" stroke="#C9A227" stroke-width="1" fill="none" opacity="0.3"/>
  </g>

  <!-- Title text -->
  <text x="140" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#gold)" letter-spacing="3">ENTERPRISE OS</text>
  <text x="140" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="300" fill="#ffffff" letter-spacing="5">INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="140" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8a8a9a" letter-spacing="2">MEDINA TECH · SOVEREIGN AI INFRASTRUCTURE · DALLAS TX</text>

  <!-- Version pill -->
  <rect x="640" y="70" width="120" height="30" rx="15" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="700" y="90" font-family="'Courier New', monospace" font-size="13" fill="url(#gold)" text-anchor="middle">v5.0.0</text>

  <!-- Phi symbol -->
  <text x="700" y="155" font-family="serif" font-size="40" fill="url(#gold)" text-anchor="middle" opacity="0.6">φ</text>
</svg>
