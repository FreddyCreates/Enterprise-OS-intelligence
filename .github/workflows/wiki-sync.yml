name: "Wiki Sync [E15] — Auto-generate Product Intelligence Wiki"

# ─────────────────────────────────────────────────────────────────────────────
# Engine identity mapping
#   E15 — Render/Export Engine : generates all wiki documents and pushes them
#   E12 — Public Summary Engine: computes counts and structures the inventory
#   E9  — Governance Memory Engine: preserves the product registry over time
#
# JOB 1 — generate-wiki  [E15·E12·E9]
#   Runs on: push to any branch except main when sdk/, production-apps/,
#            protocols/, agents/, or wiki/ files change, plus workflow_dispatch
#
#   STEP 1 — Checkout (full depth for accurate git history)
#   STEP 2 — Count and list all products by category using bash
#   STEP 3 — Generate wiki/Home.md: the complete RSHIP product intelligence
#            index, dynamically assembled from directory listings.
#   STEP 4 — Generate wiki/Airport-Economy-Platform.md covering all RSHIP-PROD
#            IDs from AECON-001 through AVWF-001.
#   STEP 5 — Git commit and push all wiki/ changes back to the branch.
#   STEP 6 — Publish generation summary to the Actions step summary.
#
# VIVIT · MEMINIT · GUBERNAT — Medina Tech · Chaos Lab
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'sdk/**'
      - 'production-apps/**'
      - 'protocols/**'
      - 'agents/**'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Generate Wiki [E15·E12·E9]
  # ───────────────────────────────────────────────────────────────────────────
  generate-wiki:
    name: "[E15·E12·E9] Generate Wiki — Product Intelligence Sync"
    runs-on: ubuntu-latest

    steps:
      - name: "[E1] Ingest — Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "[E12] Public Summary Engine — Count and list all products"
        id: inventory
        run: |
          mkdir -p wiki
          SDK_COUNT=$(ls sdk/ 2>/dev/null | wc -l || echo 0)
          PROTO_COUNT=$(ls protocols/ 2>/dev/null | wc -l || echo 0)
          APP_COUNT=$(ls production-apps/ 2>/dev/null | wc -l || echo 0)
          AGENT_COUNT=$(ls agents/ 2>/dev/null | wc -l || echo 0)
          echo "sdk_count=$SDK_COUNT" >> "$GITHUB_OUTPUT"
          echo "proto_count=$PROTO_COUNT" >> "$GITHUB_OUTPUT"
          echo "app_count=$APP_COUNT" >> "$GITHUB_OUTPUT"
          echo "agent_count=$AGENT_COUNT" >> "$GITHUB_OUTPUT"
          ls sdk/ 2>/dev/null | head -50 > .wiki_sdk_list.txt || true
          ls protocols/ 2>/dev/null | head -50 > .wiki_proto_list.txt || true
          ls production-apps/ 2>/dev/null | head -50 > .wiki_app_list.txt || true
          ls agents/ 2>/dev/null | head -50 > .wiki_agent_list.txt || true
          echo "Inventory — SDK:$SDK_COUNT PROTO:$PROTO_COUNT APPS:$APP_COUNT AGENTS:$AGENT_COUNT"

      - name: "[E15] Render/Export Engine — Generate wiki/Home.md"
        env:
          SDK_COUNT: ${{ steps.inventory.outputs.sdk_count }}
          PROTO_COUNT: ${{ steps.inventory.outputs.proto_count }}
          APP_COUNT: ${{ steps.inventory.outputs.app_count }}
          AGENT_COUNT: ${{ steps.inventory.outputs.agent_count }}
        run: |
          GEN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          BRANCH="${{ github.ref_name }}"
          python3 - << 'PYEOF'
          import os
          gen_date   = os.environ.get("GEN_DATE", "")
          branch     = os.environ.get("BRANCH", "")
          sdk_count   = os.environ.get("SDK_COUNT", "0")
          proto_count = os.environ.get("PROTO_COUNT", "0")
          app_count   = os.environ.get("APP_COUNT", "0")
          agent_count = os.environ.get("AGENT_COUNT", "0")
          def read_list(path):
              try:
                  return "\n".join(f"- `{l}`" for l in open(path).read().splitlines() if l.strip()) or "*(none)*"
              except Exception:
                  return "*(none)*"
          sdk_e   = read_list(".wiki_sdk_list.txt")
          proto_e = read_list(".wiki_proto_list.txt")
          app_e   = read_list(".wiki_app_list.txt")
          agent_e = read_list(".wiki_agent_list.txt")
          lines = [
              "# RSHIP Enterprise OS Intelligence — Master Wiki",
              "",
              "*Alfredo Medina Hernandez · Medina Tech · Dallas, Texas*",
              "*Intelligence is architecture. That's all it is. That's everything it is.*",
              "",
              "---",
              "",
              f"> **Auto-generated by E15 Render/Export Engine on {gen_date}**",
              f"> Branch: `{branch}`",
              "",
              "---",
              "",
              "## Product Portfolio",
              "",
              "### Portfolio 1 — RSHIP AGI Systems (Commercial)",
              "",
              "Enterprise-grade AGI governance and intelligence systems built for the real world.",
              "",
              "| Product ID | Name | Description |",
              "|------------|------|-------------|",
              "| RSHIP-PROD-AECON-001 | Airport Economy Console | Full-spectrum airport economy management AGI |",
              "| RSHIP-PROD-DFWCI-001 | DFW Commerce Intelligence | Real-time vendor and passenger commerce intelligence |",
              "| RSHIP-PROD-VGATE-001 | Virtual Gate Manager | AI-powered gate assignment and real-time flight coordination |",
              "| RSHIP-PROD-VCART-001 | Virtual Cart Platform | Autonomous mobile commerce and passenger service delivery |",
              "| RSHIP-PROD-ATSYS-001 | Aviation Terminal System | Terminal operations — boarding, capacity, flow management |",
              "| RSHIP-PROD-AVWF-001 | Aviation Workforce Intelligence | AI-driven crew scheduling, compliance, and optimization |",
              "| RSHIP-PROD-ORO-001 | ORO Governance Organism | 15-engine AGI governance framework — TRACE·VERIFY·REMEMBER |",
              "",
              "### Portfolio 2 — Virtual Chips + Blockchain Infrastructure",
              "",
              "| Product ID | Name | Description |",
              "|------------|------|-------------|",
              "| RSHIP-PROD-VCHIP-001 | Virtual Chip Platform | Programmable AI chips simulated in software |",
              "| RSHIP-PROD-CANI-001 | ICP Canister Runtime | Internet Computer Protocol canister infrastructure |",
              "| RSHIP-PROD-CHAIN-001 | Chain Intelligence Layer | Cross-chain intelligence and asset tracking |",
              "",
              "### Portfolio 3 — Open Source / Public Good",
              "",
              "| Product ID | Name | Description |",
              "|------------|------|-------------|",
              "| RSHIP-PROD-OPN-001 | EffectTrace Governance Organism | Open-source AGI governance SDK |",
              "| RSHIP-PROD-OPN-002 | RSHIP Protocol Suite | Open protocol specifications for AGI interoperability |",
              "| RSHIP-PROD-OPN-003 | Copilot Agent Framework | GitHub Copilot agent templates for enterprise AGI |",
              "",
              "---",
              "",
              f"## AGI SDK Registry",
              "",
              f"**Total SDKs: {sdk_count}**",
              "",
              sdk_e,
              "",
              "---",
              "",
              f"## Protocol Registry",
              "",
              f"**Total Protocols: {proto_count}**",
              "",
              proto_e,
              "",
              "---",
              "",
              f"## Production Applications",
              "",
              f"**Total Applications: {app_count}**",
              "",
              app_e,
              "",
              "---",
              "",
              f"## Copilot Agents",
              "",
              f"**Total Agents: {agent_count}**",
              "",
              agent_e,
              "",
              "---",
              "",
              "## Engine Architecture",
              "",
              "The ORO (Organism of Recursive Operations) runs 15 engines across three groups:",
              "",
              "| Group | Engines | Function |",
              "|-------|---------|----------|",
              "| TRACE | E1 E2 E3 E4 E13 | Ingest, parse, resolve, path-build, evidence |",
              "| VERIFY | E5 E6 E7 E8 E14 | Runtime truth, risk, plan, review, correction |",
              "| REMEMBER | E9 E10 E11 E12 E15 | Memory, watch, council, summary, export |",
              "",
              "---",
              "",
              "## Quick Links",
              "",
              "- [Airport Economy Platform](Airport-Economy-Platform) — Full product line deep-dive",
              "- [RSHIP Charter](../RSHIP-CHARTER.md) — Founding principles",
              "- [RSHIP Framework](../RSHIP-FRAMEWORK.md) — Architectural laws",
              "- [Ecosystem](../ECOSYSTEM.md) — Full ecosystem catalog",
              "",
              "---",
              "",
              "*VIVIT · MEMINIT · GUBERNAT — The organism lives. It remembers. It governs.*",
              "*Medina Tech · Chaos Lab · Dallas, Texas*",
          ]
          os.makedirs("wiki", exist_ok=True)
          with open("wiki/Home.md", "w") as fh:
              fh.write("\n".join(lines) + "\n")
          print(f"wiki/Home.md written ({len(lines)} lines)")
          PYEOF

      - name: "[E15] Render/Export Engine — Generate wiki/Airport-Economy-Platform.md"
        run: |
          GEN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          python3 - << 'PYEOF'
          import os
          gen_date = os.environ.get("GEN_DATE", "")
          lines = [
              "# Airport Economy Platform — Product Intelligence Deep Dive",
              "",
              "*RSHIP Enterprise OS Intelligence · Medina Tech · Dallas, Texas*",
              f"*Auto-generated by E15 Render/Export Engine on {gen_date}*",
              "",
              "---",
              "",
              "## Overview",
              "",
              "The RSHIP Airport Economy Platform is a comprehensive suite of AGI-powered products",
              "designed to transform how airports manage commerce, operations, workforce, and",
              "passenger experience. Built on the ORO 15-engine governance framework, every",
              "product in this line operates with full TRACE·VERIFY·REMEMBER accountability.",
              "",
              "**Primary market:** DFW International Airport and major U.S. hub airports",
              "**Architecture:** AGI-native, real-time, governance-first",
              "**Engine foundation:** ORO E1–E15 (all 15 engines active)",
              "",
              "---",
              "",
              "## Product Registry",
              "",
              "### RSHIP-PROD-AECON-001 — Airport Economy Console",
              "",
              "**Status:** Production-ready | **Category:** Core Platform",
              "",
              "Master control layer for the airport economy ecosystem. Aggregates vendor",
              "performance, terminal metrics, gate utilization, concession revenue, and",
              "passenger flow into a unified AGI intelligence dashboard.",
              "",
              "**Key capabilities:**",
              "- Real-time economy-wide revenue tracking and forecasting",
              "- Vendor contract compliance and performance scoring",
              "- Terminal capacity optimization with predictive load balancing",
              "- Integration hub for all other Airport Economy Platform products",
              "",
              "**Engine mapping:** E1 (Ingest) → E3 (Resolve) → E5 (Runtime Truth) → E12 (Summary) → E15 (Export)",
              "",
              "---",
              "",
              "### RSHIP-PROD-DFWCI-001 — DFW Commerce Intelligence",
              "",
              "**Status:** Production-ready | **Category:** Commerce Intelligence",
              "",
              "Real-time commerce intelligence purpose-built for DFW International Airport.",
              "Tracks every vendor transaction, passenger spend pattern, and concession",
              "performance metric across all terminals (A, B, C, D, E).",
              "",
              "**Key capabilities:**",
              "- Per-terminal, per-gate revenue analytics",
              "- Passenger spend heatmaps by time-of-day and flight segment",
              "- Vendor benchmarking against DFW performance standards",
              "- Automated compliance alerts for vendor agreement violations",
              "",
              "**Engine mapping:** E2 (Parse) → E6 (Risk) → E9 (Memory) → E12 (Summary)",
              "",
              "---",
              "",
              "### RSHIP-PROD-VGATE-001 — Virtual Gate Manager",
              "",
              "**Status:** Production-ready | **Category:** Operations Intelligence",
              "",
              "AI-powered gate assignment and real-time flight coordination. Eliminates gate",
              "conflicts, optimizes turnaround times, and coordinates ground crew, jetbridge,",
              "and catering operations through a single AGI control plane.",
              "",
              "**Key capabilities:**",
              "- Dynamic gate assignment with conflict detection",
              "- Real-time flight delay propagation and cascade management",
              "- Ground crew coordination and task dispatch",
              "- Integration with airline operations control centers",
              "",
              "**Engine mapping:** E3 (Target Resolve) → E4 (Effect Path) → E7 (Verification Plan) → E10 (Post-Execution Watch)",
              "",
              "---",
              "",
              "### RSHIP-PROD-VCART-001 — Virtual Cart Platform",
              "",
              "**Status:** Production-ready | **Category:** Mobile Commerce",
              "",
              "Autonomous mobile commerce and passenger service delivery. Powers the next",
              "generation of in-terminal food delivery, retail pickup, and service fulfillment",
              "through AI-routed mobile carts and autonomous delivery units.",
              "",
              "**Key capabilities:**",
              "- AI-optimized delivery routing through terminal concourses",
              "- Real-time order management and fulfillment tracking",
              "- Integration with AECON vendor ecosystem",
              "- Passenger-facing mobile ordering and payment",
              "",
              "**Engine mapping:** E1 (Ingest) → E4 (Effect Path) → E8 (Reviewer) → E15 (Export)",
              "",
              "---",
              "",
              "### RSHIP-PROD-ATSYS-001 — Aviation Terminal System",
              "",
              "**Status:** Production-ready | **Category:** Terminal Operations",
              "",
              "Comprehensive terminal operations intelligence covering boarding management,",
              "passenger flow optimization, security queue modeling, and capacity forecasting.",
              "",
              "**Key capabilities:**",
              "- Boarding process optimization with biometric integration points",
              "- Passenger flow simulation and real-time crowd management",
              "- Security checkpoint throughput modeling",
              "- ADA compliance monitoring and accessibility routing",
              "",
              "**Engine mapping:** E2 (Parse) → E5 (Runtime Truth) → E11 (Agent Council) → E12 (Summary)",
              "",
              "---",
              "",
              "### RSHIP-PROD-AVWF-001 — Aviation Workforce Intelligence",
              "",
              "**Status:** Production-ready | **Category:** Workforce Management",
              "",
              "AI-driven crew scheduling, regulatory compliance, and workforce optimization.",
              "Handles FAA duty-time regulations, union contract enforcement, and real-time",
              "schedule disruption management.",
              "",
              "**Key capabilities:**",
              "- FAA Part 117 and Part 121 duty-time compliance engine",
              "- Union contract rule enforcement with real-time alerts",
              "- Disruption recovery scheduling for irregular operations",
              "- Workforce performance analytics and skills gap detection",
              "",
              "**Engine mapping:** E6 (Risk) → E7 (Plan) → E13 (Evidence) → E14 (Dispute/Correction)",
              "",
              "---",
              "",
              "## Product IDs Quick Reference",
              "",
              "| Product ID | Name | Status |",
              "|------------|------|--------|",
              "| RSHIP-PROD-AECON-001 | Airport Economy Console | Production |",
              "| RSHIP-PROD-DFWCI-001 | DFW Commerce Intelligence | Production |",
              "| RSHIP-PROD-VGATE-001 | Virtual Gate Manager | Production |",
              "| RSHIP-PROD-VCART-001 | Virtual Cart Platform | Production |",
              "| RSHIP-PROD-ATSYS-001 | Aviation Terminal System | Production |",
              "| RSHIP-PROD-AVWF-001 | Aviation Workforce Intelligence | Production |",
              "",
              "---",
              "",
              "*VIVIT · MEMINIT · GUBERNAT — Medina Tech · Chaos Lab · Dallas, Texas*",
          ]
          with open("wiki/Airport-Economy-Platform.md", "w") as fh:
              fh.write("\n".join(lines) + "\n")
          print(f"wiki/Airport-Economy-Platform.md written ({len(lines)} lines)")
          PYEOF

      - name: "[E9] Governance Memory Engine — Commit and push wiki changes"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .wiki_sdk_list.txt .wiki_proto_list.txt .wiki_app_list.txt .wiki_agent_list.txt
          git add wiki/
          COMMIT_MSG=$(printf 'docs(wiki): auto-sync product intelligence wiki [E15]\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>')
          git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          git push

      - name: "[E15] Render/Export — Publish wiki sync summary"
        env:
          SDK_COUNT: ${{ steps.inventory.outputs.sdk_count }}
          PROTO_COUNT: ${{ steps.inventory.outputs.proto_count }}
          APP_COUNT: ${{ steps.inventory.outputs.app_count }}
          AGENT_COUNT: ${{ steps.inventory.outputs.agent_count }}
        run: |
          GEN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          BRANCH="${{ github.ref_name }}"
          echo "### 📚 Wiki Sync [E15] — Product Intelligence Wiki" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Generated:** ${GEN_DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Document | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`wiki/Home.md\` | ✅ Generated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`wiki/Airport-Economy-Platform.md\` | ✅ Generated |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Product Inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AGI SDKs | $SDK_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Protocols | $PROTO_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production Apps | $APP_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Copilot Agents | $AGENT_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "*E15 Render/Export Engine · E12 Public Summary · E9 Governance Memory*" >> "$GITHUB_STEP_SUMMARY"
          echo "*VIVIT · MEMINIT · GUBERNAT — Medina Tech · Chaos Lab*" >> "$GITHUB_STEP_SUMMARY"
